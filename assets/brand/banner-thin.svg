<svg width="1200" height="110" viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip"><rect width="1200" height="110" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="110" fill="#0d1512"/>

    <!-- faint concentric arcs, right side, echoing the full banner -->
    <g stroke="#16241f" stroke-width="10" fill="none">
      <circle cx="1180" cy="20" r="90"/>
      <circle cx="1180" cy="20" r="140"/>
      <circle cx="1180" cy="20" r="190"/>
    </g>

    <!-- mark: three concentric arcs opening down-left, plus origin dot -->
    <g transform="translate(46,55)" stroke="#2fd9a4" fill="none" stroke-linecap="round">
      <path d="M -8,20 A 22,22 0 1 1 22,20" stroke-width="6"/>
      <path d="M -16,26 A 30,30 0 1 1 30,26" stroke-width="6" opacity="0.75"/>
      <path d="M -24,32 A 38,38 0 1 1 38,32" stroke-width="6" opacity="0.5"/>
      <circle cx="-9" cy="21" r="5" fill="#2fd9a4" stroke="none"/>
    </g>

    <!-- wordmark -->
    <text x="108" y="70" font-family="Noto Sans Mono, monospace" font-weight="700"
          font-size="44" fill="#eef3f1" letter-spacing="0">fobiat</text>

    <!-- separator -->
    <rect x="360" y="40" width="2" height="30" fill="#22352d"/>

    <!-- domain -->
    <text x="384" y="63" font-family="Noto Sans Mono, monospace" font-weight="400"
          font-size="20" fill="#6b8f83">fobiat.dev</text>

    <!-- bottom accent strip -->
    <rect x="0" y="106" width="1200" height="4" fill="#2fd9a4"/>
  </g>
</svg>
